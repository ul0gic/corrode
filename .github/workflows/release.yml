name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare Cargo versions across the merge
        id: compare
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(python3 .github/scripts/release-version.py "$BEFORE" "$GITHUB_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    env:
      TAG: v${{ needs.version.outputs.version }}
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: corrode-scanner
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: corrode-scanner
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: corrode-scanner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned commit (no release tags)
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Create archive
        run: |
          archive="corrode-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corrode-${{ matrix.target }}
          if-no-files-found: error
          path: |
            corrode-${{ env.TAG }}-${{ matrix.target }}.tar.gz
            corrode-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Tag the merged commit
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          ref="refs/tags/$TAG"
          if git show-ref --verify --quiet "$ref"; then
            existing=$(git rev-parse "$ref^{commit}")
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG already points to $existing"
              exit 1
            fi
          else
            git push origin "$GITHUB_SHA:$ref"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            corrode-*.tar.gz
            corrode-*.sha256

  publish:
    name: Publish to crates.io
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned commit (no release tags)
        with:
          toolchain: 1.100.0

      - name: Publish to crates.io
        run: |
          curl --fail --silent --show-error --retry 3 https://index.crates.io/co/rr/corrode-scanner -o "$RUNNER_TEMP/crate-index"
          published=$(jq -cs --arg version "$VERSION" 'any(.[]; .vers == $version)' "$RUNNER_TEMP/crate-index")
          if [[ "$published" == true ]]; then
            echo "corrode-scanner $VERSION is already published."
          else
            cargo publish --locked
          fi
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
